name: Build Intel macOS package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline backend tests and build
        run: python3 scripts/build.py
      - name: Native menu app tests and build
        run: python3 app/build_app.py
      - name: Package without installation
        run: python3 scripts/package_release.py
      - name: Inspect package without installation
        run: python3 scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: MagicBayLTE-Intel-preview
          path: dist/
          if-no-files-found: error
